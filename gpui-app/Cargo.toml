[package]
name = "win11-clipboard-history-gpui"
version = "1.0.2"
description = "Windows 11-style Clipboard History Manager for Linux — GPUI frontend (v0.8.0 milestone)"
authors = ["gustavosett"]
license = "MIT"
repository = "https://github.com/Aorus22/Win11-Clipboard-Linux"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "win11-clipboard-history-gpui"
path = "src/main.rs"

[dependencies]
# Pinned: GPUI is pre-1.0 with frequent breaking changes (see .planning/research/SUMMARY.md).
# `gpui-pre` is the Zed gpui snapshot published to crates.io; its lib is still named `gpui`.
# It is patched below with Aorus22/gpui-wayland-patches (layer-shell + blur) via [patch.crates-io].
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["wayland", "x11"] }
anyhow = "1"
# Reused core backend — shared with Tauri app, completely decoupled from Tauri UI
win11-clipboard-history-lib = { package = "win11-clipboard-core", path = "../core" }
# Toolkit-independent code shared with the iced frontend.
app-shared = { path = "../app-shared" }
# System integration (Phase 5): tray, global hotkeys, portal theme listener.
tray-icon = "0.24"
muda = "0.19"
global-hotkey = "0.8"
zbus = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6.0"
chrono = "0.4"
base64 = "0.23"
image = "0.25"
x11rb = "0.14"
# Client-side popup drag (ConfigureWindow + pointer polling) on the X11 backend.
regex = "1"
parking_lot = "0.12"
futures-lite = "2"
tokio = { version = "1", features = ["full"] }
# GTK init for the AppIndicator tray backend (same stack the Tauri build uses).
gtk = "0.18"
# Manual "Check for updates" (GitHub Releases) — blocking client, same version/features as core.
reqwest = { version = "0.13.3", features = ["blocking"] }
semver = "1"
sha2 = "0.10"

# GPUI with the Wayland layer-shell / blur patches (public fork snapshot), pinned by rev.
[patch.crates-io]
gpui-pre = { git = "https://github.com/Aorus22/gpui-wayland-patches", rev = "7c341f1ffa8c2cad4a194a78e6b83aa48de102f9" }
gpui-pre-linux = { git = "https://github.com/Aorus22/gpui-wayland-patches", rev = "7c341f1ffa8c2cad4a194a78e6b83aa48de102f9" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
