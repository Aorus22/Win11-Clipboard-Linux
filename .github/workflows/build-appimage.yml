name: Build AppImage

# AppImage builds for Win11-Clipboard-Linux, meniru pola
# web-term/.github/workflows/build-appimage.yml.
#
# The AppImages are produced by docker/Dockerfile.build via
# docker/build-appimage.sh, so CI and a local run use byte-identical toolchains
# (see docker/README.md):
#
#   dist/win11-clipboard-history_*_amd64.AppImage              Tauri frontend
#   dist/win11-clipboard-history_*_x86_64.AppImage             GPUI frontend
#   dist/SHA256SUMS.txt
#
# What each ref gets:
#   main   -> Actions artifact + rolling "latest" GitHub Release
#   v* tag -> versioned GitHub Release
#   PR     -> Actions artifact only (nothing is published)
#
# The rolling release keeps a stable download URL:
#   https://github.com/<owner>/<repo>/releases/download/latest/win11-clipboard-history_<version>_amd64.AppImage
#
# No `paths:` filter on purpose: a `v*` tag push must always produce a release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache cargo / npm downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.npm
          key: build-caches-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'gpui-app/Cargo.lock', 'package-lock.json') }}
          restore-keys: |
            build-caches-${{ runner.os }}-

      - name: Build builder image
        run: docker build -f docker/Dockerfile.build -t winclip-build .

      - name: Build AppImages
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -v "$HOME/.cargo/git:/usr/local/cargo/git" \
            -v "$HOME/.npm:/root/.npm" \
            -w /src \
            winclip-build bash docker/build-appimage.sh

      # Checks the end-user contract from the artifacts themselves:
      # every AppImage must verify against SHA256SUMS and extract without FUSE.
      - name: Verify variants
        run: |
          set -euo pipefail
          ls -l dist
          cat dist/SHA256SUMS.txt
          ( cd dist && sha256sum -c SHA256SUMS.txt )

          work="$(mktemp -d)"
          for image in "$PWD"/dist/*.AppImage; do
            name="$(basename "$image")"
            rm -rf "${work:?}/squashfs-root"
            ( cd "$work" && "$image" --appimage-extract >/dev/null )
            entries="$(find "$work/squashfs-root" -maxdepth 1 | wc -l)"
            size="$(du -h "$image" | cut -f1)"
            echo "$name  size=$size  root-entries=$entries  extract=ok"
          done

      # The build container runs as root, so the mount-backed caches come back
      # root-owned (cargo also unpacks registry sources read-only) and the
      # actions/cache post step would then fail to tar them. Hand them back.
      - name: Fix cache ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$HOME/.cargo" "$HOME/.npm" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Win11Clipboard-AppImage-${{ github.sha }}
          path: |
            dist/*.AppImage
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      # A main push keeps the rolling `latest` release current, a v* tag
      # publishes that tag. Same assets either way, so a download URL stays
      # valid across merges.
      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t APPIMAGES < <(ls dist/*.AppImage)
          if [[ "${#APPIMAGES[@]}" -ne 2 ]]; then
            echo "expected 2 AppImages (Tauri + GPUI), found ${#APPIMAGES[@]}" >&2
            exit 1
          fi

          TAURI=""
          GPUI=""
          for image in "${APPIMAGES[@]}"; do
            case "$(basename "$image")" in
              *_amd64.AppImage) TAURI="$image" ;;
              *_x86_64.AppImage) GPUI="$image" ;;
            esac
          done
          if [[ -z "$TAURI" || -z "$GPUI" ]]; then
            echo "expected one Tauri and one GPUI AppImage, got: ${APPIMAGES[*]}" >&2
            exit 1
          fi

          VERSION="$(node -p "require('./package.json').version")"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="Win11 Clipboard For Linux ${TAG}"
            # The tag is what triggered this run, so it already exists.
            CREATE_ARGS=(--verify-tag)
          else
            TAG="latest"
            TITLE="Win11 Clipboard - latest from main"
            # Rolling tag: create it on the first main build, then just move
            # the assets along on later ones.
            CREATE_ARGS=(--target "${GITHUB_SHA}")
          fi

          {
            echo "AppImage v${VERSION} built from \`${GITHUB_SHA:0:7}\` on \`${GITHUB_REF_NAME}\`."
            echo
            echo "| asset | frontend | sha256 |"
            echo "| --- | --- | --- |"
            echo "| \`$(basename "${TAURI}")\` | Tauri | \`$(sha256sum "${TAURI}" | cut -d' ' -f1)\` |"
            echo "| \`$(basename "${GPUI}")\` | GPUI | \`$(sha256sum "${GPUI}" | cut -d' ' -f1)\` |"
            echo
            echo "Download:"
            echo
            echo '```bash'
            echo "gh release download ${TAG} --repo ${GITHUB_REPOSITORY} --pattern '*.AppImage'"
            echo "# or:"
            echo "# chmod +x win11-clipboard-history_*.AppImage && ./win11-clipboard-history_*.AppImage"
            echo '```'
          } > notes.md

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${APPIMAGES[@]}" dist/SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --notes-file notes.md
          else
            gh release create "${TAG}" "${APPIMAGES[@]}" dist/SHA256SUMS.txt \
              --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --notes-file notes.md "${CREATE_ARGS[@]}"
          fi

          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json url,assets \
            --jq '.url, (.assets[] | "  " + .name + "  " + (.size | tostring) + " bytes")'
