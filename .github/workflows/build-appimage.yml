name: Build AppImage

# "Anylinux" AppImage of the GPUI frontend, built with quick-sharun
# (https://github.com/pkgforge-dev/Anylinux-AppImages). The image bundles glibc,
# the dynamic loader and every library (GTK, Mesa, Vulkan, xkbcommon, ...), so
# ONE build runs on any x86_64 Linux regardless of distro or glibc version.
# Only the kernel, and NVIDIA's proprietary driver on NVIDIA machines, come from
# the host. quick-sharun needs an Arch Linux build base (hence the container).
#
#   dist/win11-clipboard-history_<version>_x86_64.AppImage
#   dist/SHA256SUMS.txt
#
# Jobs: build (Arch container) -> smoke (the same file on Fedora/Ubuntu/Debian/
# Arch/Alpine, CLI paths only: there is no display) -> publish (optional).
#
# Nothing here runs automatically. Invoke from the Actions tab ("Run workflow"):
#   beta channel (default)     -> rolling prerelease tagged `beta`, version
#                                 X.Y.Z-beta.<run number> stamped onto the
#                                 Cargo.toml copy on the runner. For manual
#                                 testing only; the in-app updater reads
#                                 /releases/latest and never offers a
#                                 prerelease. Older beta assets are replaced.
#   stable + publish latest    -> rolling release, stable download URL
#   stable + publish vX.Y.Z    -> versioned release (tag is created if missing)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'beta (rolling prerelease for testing) or stable (uses the tag input)'
        required: true
        default: 'beta'
        type: choice
        options: [beta, stable]
      tag:
        description: 'stable only: Release tag to publish to (latest = rolling, vX.Y.Z = versioned)'
        required: false
        default: 'latest'
      publish:
        description: 'Publish the built AppImage to Releases'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Anylinux AppImage (x86_64)
    runs-on: ubuntu-latest
    container: ghcr.io/pkgforge-dev/archlinux:latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Resolve channel
        id: ch
        run: |
          echo "channel=${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
          # Beta trades a little runtime speed for a much shorter build: no LTO.
          # Stable keeps the release profile from Cargo.toml. Set before the
          # build so cargo sees it.
          if [[ "${{ inputs.channel }}" == "beta" ]]; then
            echo "CARGO_PROFILE_RELEASE_LTO=off" >> "$GITHUB_ENV"
            echo "CARGO_PROFILE_RELEASE_DEBUG=0" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Preparing container
        uses: pkgforge-dev/anylinux-setup-action@b2d1ce4216f71162e00ae58fa11ee9aeb723d0d5 # v5

      - name: Cache cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-arch-${{ hashFiles('gpui-app/Cargo.lock') }}
          restore-keys: |
            cargo-arch-

      - name: Install dependencies
        run: /bin/sh scripts/anylinux/get-dependencies.sh

      - name: Check version and stamp beta
        id: ver
        run: |
          BASE="$(grep -m1 '^version' gpui-app/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          if [[ "${{ inputs.channel }}" == "beta" ]]; then
            # Only on the runner: the app shows this version via --version and
            # the AppImage file name carries it. The local file is untouched.
            VERSION="${BASE}-beta.${GITHUB_RUN_NUMBER}"
            sed -i "0,/^version = \"${BASE}\"/s//version = \"${VERSION}\"/" gpui-app/Cargo.toml
          else
            VERSION="$BASE"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Fail fast (before the multi-minute AppImage build) and gate the release
      # on the core crate's tests: storage schema, migration, GC, limits.
      - name: Run core tests
        run: cargo test --manifest-path core/Cargo.toml

      - name: Make AppImage
        run: /bin/sh scripts/anylinux/make-appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Win11Clipboard-AppImage-${{ github.sha }}
          path: |
            dist/*.AppImage
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  # The same file, unmodified, on distros that differ in glibc, libc flavour and
  # installed libraries. Without a display only the pure CLI paths can run, which
  # is exactly what proves the bundled glibc + libraries load.
  smoke:
    name: Run on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - fedora:43
          - fedora:44
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
          - archlinux:latest
          - alpine:latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: Win11Clipboard-AppImage-${{ github.sha }}
          path: dist

      # Plain `docker run` (not a job container): these images have no Node, and
      # the point is to run the file on the bare distro.
      - name: --help and --version on ${{ matrix.image }}
        run: |
          chmod +x dist/*.AppImage
          docker run --rm -v "$PWD/dist:/dist:ro" "${{ matrix.image }}" sh -c '
            head -2 /etc/os-release
            cp /dist/*.AppImage /tmp/app && chmod +x /tmp/app
            /tmp/app --help | head -12
            /tmp/app --version
          '

  publish:
    name: Publish release
    if: inputs.publish
    needs: [build, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: Win11Clipboard-AppImage-${{ github.sha }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail

          mapfile -t APPIMAGES < <(ls dist/*.AppImage)
          if [[ "${#APPIMAGES[@]}" -ne 1 ]]; then
            echo "expected 1 GPUI AppImage, found ${#APPIMAGES[@]}" >&2
            exit 1
          fi

          APPIMAGE="${APPIMAGES[0]}"
          # The build job stamps the beta version onto its runner copy of
          # Cargo.toml; this job checks out fresh, so the version must come
          # from the build job's output.
          TAG="$RELEASE_TAG"

          if [[ "$CHANNEL" == "beta" ]]; then
            TAG="beta"
            TITLE="Win11 Clipboard beta"
            {
              echo "Beta build ${VERSION} from \`${GITHUB_SHA:0:7}\` (branch ${GITHUB_REF_NAME})."
              echo
              echo "For manual testing only. The in-app updater does not offer it."
              echo
              echo "Download:"
              echo
              echo '```bash'
              echo "gh release download beta --repo ${GITHUB_REPOSITORY} --pattern '*.AppImage'"
              echo '```'
            } > notes.md

            if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              # Rolling prerelease: drop assets of earlier beta builds so only
              # the newest remains.
              gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | while read -r a; do
                gh release delete-asset "$TAG" "$a" --repo "${GITHUB_REPOSITORY}" --yes
              done
              gh release upload "$TAG" "$APPIMAGE" dist/SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --clobber
              gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" --title "$TITLE" --notes-file notes.md --prerelease
            else
              gh release create "$TAG" "$APPIMAGE" dist/SHA256SUMS.txt \
                --repo "${GITHUB_REPOSITORY}" --title "$TITLE" --notes-file notes.md \
                --target "$GITHUB_SHA" --prerelease
            fi
            gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" --json url --jq .url
            exit 0
          fi

          if [[ "$TAG" == "latest" ]]; then
            TITLE="Win11 Clipboard - latest from main"
            # Rolling tag: create it on the first manual publish, then just
            # move the assets along on later ones.
            CREATE_ARGS=(--target "${GITHUB_SHA}" --prerelease)
          else
            TITLE="Win11 Clipboard For Linux ${TAG}"
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              # The tag already exists, publish onto it.
              CREATE_ARGS=(--verify-tag --latest)
            else
              # Fresh versioned tag, created at this commit.
              CREATE_ARGS=(--target "${GITHUB_SHA}" --latest)
            fi
          fi

          {
            echo "GPUI AppImage v${VERSION} built from \`${GITHUB_SHA:0:7}\`."
            echo
            echo "sha256: \`$(sha256sum "${APPIMAGE}" | cut -d' ' -f1)\`"
            echo
            echo "Download:"
            echo
            echo '```bash'
            echo "gh release download ${TAG} --repo ${GITHUB_REPOSITORY} --pattern '*.AppImage'"
            echo "# or:"
            echo "# chmod +x win11-clipboard-history_*.AppImage && ./win11-clipboard-history_*.AppImage"
            echo '```'
          } > notes.md

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${APPIMAGE}" dist/SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --notes-file notes.md
            # The in-app updater reads /releases/latest: keep the rolling
            # build a prerelease so only vX.Y.Z releases are offered.
            if [[ "$TAG" == "latest" ]]; then
              gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --prerelease
            else
              gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --prerelease=false --latest
            fi
          else
            gh release create "${TAG}" "${APPIMAGE}" dist/SHA256SUMS.txt \
              --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --notes-file notes.md "${CREATE_ARGS[@]}"
          fi

          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json url,assets \
            --jq '.url, (.assets[] | "  " + .name + "  " + (.size | tostring) + " bytes")'
