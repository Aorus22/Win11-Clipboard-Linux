name: Build AppImage

# AppImage builds for Win11-Clipboard-Linux, meniru pola
# web-term/.github/workflows/build-appimage.yml.
#
# The AppImage is produced by docker/Dockerfile.build via
# docker/build-appimage.sh, so CI and a local run use byte-identical toolchains
# (see docker/README.md). GPUI only — the Tauri frontend is not built here.
#
#   dist/win11-clipboard-history_*_x86_64.AppImage
#   dist/SHA256SUMS.txt
#
# What each run gets:
#   manual dispatch            -> build, Actions artifact
#   manual dispatch + publish  -> build + publish to the given tag in Releases
#
# Nothing here runs automatically. Invoke explicitly from the Actions tab
# ("Run workflow") with a tag and the publish checkbox:
#   latest + publish   -> rolling release, stable download URL
#   vX.Y.Z + publish   -> versioned release (tag is created if missing)
#
# The rolling release keeps a stable download URL:
#   https://github.com/<owner>/<repo>/releases/download/latest/win11-clipboard-history_<version>_amd64.AppImage
#
# No `paths:` filter on purpose: a `v*` tag push must always produce a release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to (latest = rolling, vX.Y.Z = versioned)'
        required: true
        default: 'latest'
      publish:
        description: 'Publish the built AppImages to Releases'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache cargo downloads and sccache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/sccache
          key: build-caches-${{ runner.os }}-${{ hashFiles('docker/Dockerfile.build', 'gpui-app/Cargo.lock', 'core/Cargo.toml') }}
          restore-keys: |
            build-caches-${{ runner.os }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.build
          tags: winclip-build
          load: true
          # Image layers (apt deps, sccache, helper tools) survive across runs
          # in the GitHub cache, so rebuilds skip unchanged layers.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build AppImage
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -v "$HOME/.cargo/git:/usr/local/cargo/git" \
            -v "$HOME/.cache/sccache:/root/.cache/sccache" \
            -w /src \
            winclip-build bash docker/build-appimage.sh

      # Checks the end-user contract from the artifacts themselves:
      # every AppImage must verify against SHA256SUMS and extract without FUSE.
      - name: Verify variants
        run: |
          set -euo pipefail
          ls -l dist
          cat dist/SHA256SUMS.txt
          ( cd dist && sha256sum -c SHA256SUMS.txt )

          work="$(mktemp -d)"
          for image in "$PWD"/dist/*.AppImage; do
            name="$(basename "$image")"
            rm -rf "${work:?}/squashfs-root"
            ( cd "$work" && "$image" --appimage-extract >/dev/null )
            entries="$(find "$work/squashfs-root" -maxdepth 1 | wc -l)"
            size="$(du -h "$image" | cut -f1)"
            echo "$name  size=$size  root-entries=$entries  extract=ok"
          done

      # The build container runs as root, so the mount-backed caches come back
      # root-owned (cargo also unpacks registry sources read-only) and the
      # actions/cache post step would then fail to tar them. Hand them back.
      - name: Fix cache ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$HOME/.cargo" "$HOME/.cache/sccache" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Win11Clipboard-AppImage-${{ github.sha }}
          path: |
            dist/*.AppImage
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      # Published ONLY on explicit manual dispatch with publish ticked —
      # never automatically. Pick the tag in the Actions tab ("Run workflow"):
      # `latest` for the rolling release, `vX.Y.Z` for a versioned one
      # (created if missing).
      - name: Publish release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          mapfile -t APPIMAGES < <(ls dist/*.AppImage)
          if [[ "${#APPIMAGES[@]}" -ne 1 ]]; then
            echo "expected 1 GPUI AppImage, found ${#APPIMAGES[@]}" >&2
            exit 1
          fi

          APPIMAGE="${APPIMAGES[0]}"

          VERSION="$(grep -m1 '^version' gpui-app/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"

          TAG="${RELEASE_TAG}"

          if [[ "${TAG}" == "latest" ]]; then
            TITLE="Win11 Clipboard - latest from main"
            # Rolling tag: create it on the first manual publish, then just
            # move the assets along on later ones.
            CREATE_ARGS=(--target "${GITHUB_SHA}")
          else
            TITLE="Win11 Clipboard For Linux ${TAG}"
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              # The tag already exists, publish onto it.
              CREATE_ARGS=(--verify-tag)
            else
              # Fresh versioned tag, created at this commit.
              CREATE_ARGS=(--target "${GITHUB_SHA}")
            fi
          fi

          {
            echo "GPUI AppImage v${VERSION} built from \`${GITHUB_SHA:0:7}\`."
            echo
            echo "sha256: \`$(sha256sum "${APPIMAGE}" | cut -d' ' -f1)\`"
            echo
            echo "Download:"
            echo
            echo '```bash'
            echo "gh release download ${TAG} --repo ${GITHUB_REPOSITORY} --pattern '*.AppImage'"
            echo "# or:"
            echo "# chmod +x win11-clipboard-history_*.AppImage && ./win11-clipboard-history_*.AppImage"
            echo '```'
          } > notes.md

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${APPIMAGE}" dist/SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --notes-file notes.md
          else
            gh release create "${TAG}" "${APPIMAGE}" dist/SHA256SUMS.txt \
              --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --notes-file notes.md "${CREATE_ARGS[@]}"
          fi

          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json url,assets \
            --jq '.url, (.assets[] | "  " + .name + "  " + (.size | tostring) + " bytes")'
