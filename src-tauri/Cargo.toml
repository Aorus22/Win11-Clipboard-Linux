[package]
name = "win11-clipboard-history-lib"
version = "0.7.1"
description = "A Windows 11-style Clipboard History Manager for Linux (Tauri frontend wrapper)"
authors = ["gustavosett"]
license = "MIT"
repository = "https://github.com/gustavosett/Windows-11-Clipboard-History-For-Linux"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "win11-clipboard-history-bin"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
# Core backend shared crate
win11-clipboard-core = { path = "../core" }

# Tauri Core
tauri = { version = "2.11.0", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-global-shortcut = "2"

# Async Runtime & Synchronization
tokio = { version = "1.52.2", features = ["full"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-lite = "2"
dirs = "6.0"

# Direct platform utilities for main window/pointer operations
arboard = { version = "3.4", features = ["image-data", "wayland-data-control"] }
x11rb = { version = "0.14", features = ["allow-unsafe-code", "xtest"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
