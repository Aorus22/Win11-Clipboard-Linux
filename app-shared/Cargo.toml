[package]
name = "app-shared"
version = "0.1.0"
description = "Toolkit-independent parts of the Win11 Clipboard History frontends (GPUI, iced)"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[dependencies]
win11-clipboard-history-lib = { package = "win11-clipboard-core", path = "../core" }
anyhow = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6.0"
chrono = "0.4"
regex = "1"
base64 = "0.23"
image = "0.25"
zbus = "5"
libc = "0.2"
x11rb = { version = "0.14", features = ["randr"] }
global-hotkey = "0.8"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
